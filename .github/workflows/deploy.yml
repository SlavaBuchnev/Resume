name: Build Resume

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: [ru, en]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Compile PDF for ${{ matrix.lang }}
        run: |
          typst compile lang/${{ matrix.lang }}.typ _site/resume_${{ matrix.lang }}.pdf --root

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.lang }}
          path: _site/resume_${{ matrix.lang }}.pdf

  deploy:
    needs: build-pdfs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean and create build directory
        run: |
          rm -rf _site
          mkdir -p _site

      - name: Download all PDFs
        uses: actions/download-artifact@v4
        with:
          pattern: pdf-*
          path: _site
          merge-multiple: true

      - name: Copy Website Files
        run: |
          cp -r web/* _site/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
